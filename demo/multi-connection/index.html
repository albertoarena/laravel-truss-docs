<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laravel Truss: multiple connections demo</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E*%7Bstroke:%2312356b;fill:none;stroke-width:1.7%7Dcircle%7Bfill:%2312356b;stroke:none%7D@media(prefers-color-scheme:dark)%7B*%7Bstroke:%235fd0e6%7Dcircle%7Bfill:%235fd0e6%7D%7D%3C/style%3E%3Cpath d='M16 5 L27 26 H5 Z'/%3E%3Cpath d='M16 5 V17'/%3E%3Cpath d='M5 26 L16 17'/%3E%3Cpath d='M27 26 L16 17'/%3E%3Ccircle cx='16' cy='5' r='2.4'/%3E%3Ccircle cx='5' cy='26' r='2.4'/%3E%3Ccircle cx='27' cy='26' r='2.4'/%3E%3Ccircle cx='16' cy='17' r='2.4'/%3E%3C/svg%3E">

    <!-- The exact assets Truss ships, copied into ../assets at build time (see
         scripts/copy-demo-assets.mjs). This page lives one level deeper than the
         main demo, so the paths step up one directory but reuse the same copy. -->
    <link rel="stylesheet" href="../assets-v1.7.0/truss.css">
    <script src="../assets-v1.7.0/vendor/mermaid.min.js"></script>

    <!-- A slim site bar sits above the app so the demo belongs to trussphp.com.
         It reuses the app's own blueprint tokens (--bp-*, set by truss.css), so
         it stays on-palette and theme-reactive without loading anything else. -->
    <style>
      :root { --site-bar-h: 48px; }
      /* The whole thing fits one screen; the diagram viewport pans on its own. */
      html, body { overflow: hidden; }
      /* Reserve room for the site bar on top of the app's toolbar + footer. */
      #truss-viewport { height: calc(100vh - 54px - 28px - var(--site-bar-h)) !important; }
      /* Anchor the app's absolutely-positioned overlays (the legend) to the app,
         not the viewport, so the site bar above the app cannot drop the legend
         onto the toolbar. Mirrors the package fix (#truss-app position: relative). */
      #truss-app { position: relative; }
      /* One theme control (in the site bar); the app's own button is redundant. */
      #truss-theme-btn { display: none !important; }

      .site-bar {
        height: var(--site-bar-h);
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; padding: 0 18px;
        background: var(--bp-panel);
        border-bottom: 1px solid var(--bp-panel-line);
        font-family: var(--bp-mono);
      }
      .site-bar-logo {
        display: inline-flex; align-items: center; gap: 9px;
        text-decoration: none; color: var(--bp-ink);
      }
      .site-bar-word { font-weight: 600; font-size: 17px; letter-spacing: -0.05em; }
      /* A caption naming what this demo shows, so the two connections are obvious. */
      .site-bar-tag { font-family: var(--bp-mono); font-size: 12px; color: var(--bp-muted); letter-spacing: -0.01em; }
      .site-bar-nav { display: flex; align-items: center; gap: 18px; }
      .site-bar-nav a {
        font-size: 13px; color: var(--bp-muted); text-decoration: none; letter-spacing: -0.01em;
      }
      .site-bar-nav a:hover { color: var(--bp-fg); }
      .site-bar-theme {
        background: transparent; border: 1px solid var(--bp-panel-line); border-radius: 7px;
        color: var(--bp-muted); width: 32px; height: 28px; cursor: pointer; font-size: 14px; line-height: 1;
      }
      .site-bar-theme:hover { color: var(--bp-fg); }
      /* One cycling icon, three states (light / dark / system). */
      .site-bar-theme { display: inline-flex; align-items: center; justify-content: center; }
      .site-bar-theme .ti { display: none; }
      .site-bar-theme[data-mode='light'] .ti-light { display: inline; }
      .site-bar-theme[data-mode='dark'] .ti-dark { display: inline; }
      .site-bar-theme[data-mode='auto'] .ti-system { display: inline; }
      .site-bar-nav a.gh { display: inline-flex; align-items: center; }
      .site-bar a:focus-visible, .site-bar-theme:focus-visible {
        outline: 2px solid var(--bp-cyan); outline-offset: 2px; border-radius: 4px;
      }
      @media (max-width: 720px) { .site-bar-tag { display: none; } }
      @media (max-width: 560px) { .site-bar-nav a { display: none; } }
    </style>

    <!-- Reconcile the theme before paint. The app themes via data-theme on
         <html> from its own `truss-theme` key; the rest of the site uses
         `starlight-theme`. Seed one from the other so a choice made anywhere
         carries into the demo, and the app's on-load applyTheme() agrees. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('starlight-theme')
          var pref = s === 'light' || s === 'dark' ? s : 'auto'
          if (pref === 'auto') {
            // App model: no explicit theme, CSS prefers-color-scheme decides.
            document.documentElement.removeAttribute('data-theme')
            localStorage.removeItem('truss-theme')
          } else {
            document.documentElement.setAttribute('data-theme', pref)
            localStorage.setItem('truss-theme', pref)
          }
        } catch (e) {}
      })()
    </script>
</head>
<body>
    <header class="site-bar">
        <a class="site-bar-logo" href="../../" aria-label="Laravel Truss home">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="miter" aria-hidden="true">
                <path d="M16 5 L27 26 H5 Z"/><path d="M16 5 V17"/><path d="M5 26 L16 17"/><path d="M27 26 L16 17"/>
                <g fill="currentColor" stroke="none"><circle cx="16" cy="5" r="2.3"/><circle cx="5" cy="26" r="2.3"/><circle cx="27" cy="26" r="2.3"/><circle cx="16" cy="17" r="2.3"/></g>
            </svg>
            <span class="site-bar-word">truss</span>
        </a>
        <span class="site-bar-tag">Two connections. Switch with the Connections selector.</span>
        <nav class="site-bar-nav" aria-label="Site">
            <a href="../">Demo</a>
            <a href="../../getting-started/installation/">Docs</a>
            <a href="../../roadmap/">Roadmap</a>
            <a class="gh" href="https://github.com/albertoarena/laravel-truss" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.13 0 0 .67-.21 2.2.82a7.55 7.55 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.11.16 1.93.08 2.13.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            </a>
            <button class="site-bar-theme" type="button" data-theme-cycle data-mode="auto" aria-label="Theme: system" title="Theme: system (click to change)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <g class="ti ti-light" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></g>
                    <path class="ti ti-dark" d="M20 14.5A8 8 0 1 1 9.5 4a6.2 6.2 0 0 0 10.5 10.5z" />
                    <g class="ti ti-system" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="1.5" /><path d="M8.5 20.5h7M12 16.5v4" /></g>
                </svg>
            </button>
        </nav>
    </header>

    <div
        id="truss-app"
        data-schema-endpoint="./schema.json"
        data-connections='["main","modules"]'
        data-type-labels="native"
        data-warn-above="60"
        data-focus-depth="1"
        data-min-zoom="0.7"
    >
        <div class="truss-toolbar">
            <span class="truss-brand">
                <svg class="truss-mark" width="20" height="20" viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
                    <path d="M16 5 L27 26 H5 Z" stroke-width="1.7" stroke-linejoin="miter"/>
                    <path d="M16 5 V17" stroke-width="1.7"/><path d="M5 26 L16 17" stroke-width="1.7"/><path d="M27 26 L16 17" stroke-width="1.7"/>
                    <g fill="currentColor" stroke="none">
                        <circle cx="16" cy="5" r="2.4"/><circle cx="5" cy="26" r="2.4"/><circle cx="27" cy="26" r="2.4"/><circle cx="16" cy="17" r="2.4"/>
                    </g>
                </svg>
                truss
            </span>

            <label class="truss-field truss-field--search">
                <span class="truss-field-label">Filter</span>
                <input id="truss-search" type="search" placeholder="table name…" autocomplete="off">
            </label>

            <div class="truss-secondary" id="truss-more">
                <label class="truss-field">
                    <span class="truss-field-label">Focus</span>
                    <select id="truss-focus"></select>
                </label>
                <label class="truss-field">
                    <span class="truss-field-label">Depth</span>
                    <input id="truss-depth" type="number" min="0" step="1">
                </label>
                <label class="truss-field truss-field--check">
                    <input id="truss-labels" type="checkbox"> <span class="truss-field-label">Laravel types</span>
                </label>
            </div>

            <div class="truss-utils">
                <label class="truss-field truss-field--conn" hidden>
                    <span class="truss-field-label">Connections</span>
                    <select id="truss-connection"></select>
                </label>
                <button type="button" class="truss-util truss-util--more" id="truss-more-btn" title="More controls" aria-expanded="false">⋯</button>
                <button type="button" class="truss-util" id="truss-export-btn" title="Export the diagram (PNG or SVG)" aria-expanded="false">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3 v11"/><path d="M7 9 l5 5 5-5"/><path d="M4 20 h16"/>
                    </svg>
                </button>
                <button type="button" class="truss-util" id="truss-diff-btn" title="What changed since the last migration" aria-expanded="false" hidden>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 8 h8 M9 4 v8"/><path d="M11 17 h8"/>
                    </svg>
                </button>
                <button type="button" class="truss-util" id="truss-legend-btn" title="Legend" aria-expanded="false">▤</button>
                <button type="button" class="truss-util" id="truss-theme-btn" title="Theme">◐</button>
            </div>
        </div>

        <div id="truss-banners"></div>

        <main id="truss-viewport">
            <div id="truss-canvas"></div>

            <div class="truss-zoom" id="truss-zoom">
                <button type="button" data-fit title="Fit the whole diagram in view">Fit</button>
                <input id="truss-zoom-range" type="range" min="0.1" max="3" step="0.02" value="1" title="Zoom (scroll or pinch over the diagram)">
                <span id="truss-zoom-pct">100%</span>
            </div>
        </main>

        <div class="truss-legend" id="truss-legend" hidden>
            <div class="truss-legend-head">Legend</div>
            <dl class="truss-legend-list">
                <dt>PK</dt><dd>Primary key</dd>
                <dt>FK</dt><dd>Foreign key</dd>
                <dt aria-hidden="true">
                    <svg width="42" height="12" viewBox="0 0 42 12" fill="none" stroke="currentColor" stroke-width="1.3">
                        <path d="M2 2 V10 M5 2 V10"/><path d="M5 6 H30"/>
                        <path d="M30 6 L38 2 M30 6 L38 10 M30 6 H38"/><circle cx="35" cy="6" r="2.4"/>
                    </svg>
                </dt><dd>One → many</dd>
            </dl>
        </div>

        <div class="truss-diff-panel" id="truss-diff-panel" hidden>
            <div class="truss-diff-head">Changes since last migration</div>
            <div class="truss-diff-body"></div>
        </div>

        <div class="truss-popover" id="truss-popover" hidden></div>

        <footer class="truss-footer">
            <span id="truss-stat-tables">·</span>
            <span id="truss-stat-conn"></span>
            <span class="truss-flag" id="truss-stat-fallback" hidden>SQLite&nbsp;fallback</span>
            <span class="truss-footer-spacer"></span>
            <span id="truss-stat-updated"></span>
        </footer>
    </div>

    <!-- Demo-only fetch shim. A static host cannot branch on the ?connection=
         query the dashboard appends (loadSchema in truss.js), and truss.js is the
         shipped asset we must not fork. So intercept the request here and rewrite
         schema.json?connection=modules to a per-connection sample file. The real
         package reads ?connection on the server; this only stands in for that. -->
    <script>
        (function () {
            var realFetch = window.fetch.bind(window);
            window.fetch = function (input, init) {
                try {
                    // loadSchema() calls fetch() with a URL object (.href), but a
                    // string or a Request (.url) are also valid inputs, so read
                    // whichever this is before matching.
                    var href = typeof input === 'string' ? input : (input && (input.href || input.url));
                    if (href) {
                        var url = new URL(href, document.baseURI);
                        if (/\/schema\.json$/.test(url.pathname)) {
                            var conn = url.searchParams.get('connection');
                            if (conn && conn !== 'main') {
                                url.pathname = url.pathname.replace(/schema\.json$/, 'schema-' + conn + '.json');
                                url.search = '';
                                return realFetch(url.href, init);
                            }
                        }
                    }
                } catch (e) {}
                return realFetch(input, init);
            };
        })();
    </script>

    <!-- Resolve the sample schema against this page's URL, so the fetch works
         regardless of the deploy base path (loadSchema resolves relative to the
         origin, not the page). -->
    <script>
        document.getElementById('truss-app').dataset.schemaEndpoint =
            new URL('schema.json', document.baseURI).href;
    </script>
    <script type="module" src="../assets-v1.7.0/truss.js"></script>

    <!-- Site-bar theme toggle: flips data-theme on <html> (the app's CSS reacts)
         and writes both theme keys so the choice sticks across the whole site. -->
    <script>
        (function () {
            var btn = document.querySelector('[data-theme-cycle]');
            if (!btn) return;
            var order = ['light', 'dark', 'auto'];
            function pref() {
                try { var v = localStorage.getItem('starlight-theme'); if (v === 'light' || v === 'dark') return v; } catch (e) {}
                return 'auto';
            }
            function reflect(p) {
                // App model: light/dark set data-theme; auto removes it so CSS
                // prefers-color-scheme drives both the app and this bar live.
                if (p === 'auto') document.documentElement.removeAttribute('data-theme');
                else document.documentElement.setAttribute('data-theme', p);
                btn.dataset.mode = p;
                btn.setAttribute('aria-label', 'Theme: ' + p);
                btn.title = 'Theme: ' + p + ' (click to change)';
            }
            btn.addEventListener('click', function () {
                var next = order[(order.indexOf(pref()) + 1) % order.length];
                try {
                    if (next === 'auto') { localStorage.setItem('starlight-theme', ''); localStorage.removeItem('truss-theme'); }
                    else { localStorage.setItem('starlight-theme', next); localStorage.setItem('truss-theme', next); }
                } catch (e) {}
                reflect(next);
            });
            reflect(pref());
        })();
    </script>
</body>
</html>
