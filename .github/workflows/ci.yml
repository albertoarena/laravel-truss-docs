name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone. Starlight derives each
          # page's last-updated date from the commit that last touched it, and at
          # depth 1 every file resolves to the same commit, so every page would
          # claim the deploy date. The build succeeds and the output looks
          # plausible, which is what makes it worth spelling out here.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Used by scripts/copy-demo-assets.mjs to resolve the latest package
          # release and raise the GitHub API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      # The suite asserts against dist/, so it runs after the build above rather
      # than through `npm test`, whose pretest hook builds again without the
      # copy-demo-assets step. Before this, CI compiled the site and checked
      # nothing: a green tick meant only that it built.
      - name: Test
        run: npm run test:ci

      # The suite above reads markup and cannot see a rendered box. Four layout
      # failures shipped on the four demo shells without it noticing, and two of
      # those were caught by eye on a phone, which is not a process. This step
      # opens the built pages and measures them.
      #
      # Chromium only. These are layout and keyboard assertions, not a
      # cross-engine matrix, and one engine catches the class of defect that has
      # actually shipped here. It runs against dist/ through `astro preview`,
      # which is why it follows the build rather than rebuilding.
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e
