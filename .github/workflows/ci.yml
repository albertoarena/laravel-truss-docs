name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Used by scripts/copy-demo-assets.mjs to resolve the latest package
          # release and raise the GitHub API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
